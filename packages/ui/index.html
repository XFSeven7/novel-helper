<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel Helper</title>
    <script>
      (function () {
        var KEY = "novel-helper-theme";
        var IDS = {
          midnight: 1,
          forest: 1,
          ocean: 1,
          sunset: 1,
          charcoal: 1,
          paper: 1,
          sepia: 1,
          meadow: 1
        };
        function system() {
          try {
            return window.matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "midnight";
          } catch (e) {
            return "midnight";
          }
        }
        function migrate(raw) {
          if (raw && IDS[raw]) return raw;
          if (raw === "light") return "paper";
          if (raw === "dark" || raw === "default" || raw === "midnight") return "midnight";
          if (raw === "forest" || raw === "loam") return "forest";
          if (raw === "ocean") return "ocean";
          if (raw === "sunset") return "sunset";
          if (raw === "charcoal") return "charcoal";
          if (raw === "paper") return "paper";
          if (raw === "sepia" || raw === "clay" || raw === "village") return "sepia";
          if (raw === "meadow") return "meadow";
          return system();
        }
        var theme = "midnight";
        try {
          theme = migrate(localStorage.getItem(KEY));
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
